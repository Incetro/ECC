name: Incetro CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['incetro-v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: incetro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Incetro CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Incetro tests and filesystem smoke
        shell: bash
        run: node tests/incetro/run.js --e2e

  upstream:
    name: Upstream ECC tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        env:
          COREPACK_ENABLE_STRICT: '0'
          npm_config_ignore_scripts: 'true'
        run: npm install

      - name: Upstream and Incetro test suite
        shell: bash
        run: npm test
